name: ClanPlugin
version: 1.0.0
main: ru.clanplugin.ClanPlugin
api-version: '1.21'
description: Advanced Clan System Plugin
authors: [ClanDev]
softdepend: [Vault]

commands:
  clan:
    description: Main clan command
    usage: /clan <subcommand>
    aliases: [c]

permissions:
  clanplugin.admin:
    description: Full admin access
    default: op
  clanplugin.use:
    description: Use clan commands
    default: true